name: CI

# Runs on every pull request so problems are caught before merging to main.
# (main now requires a PR, so this covers all changes; main's own pushes are
# handled by the deploy workflows.)
on:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate inline JavaScript & HTML
        run: node .github/scripts/check-syntax.mjs
