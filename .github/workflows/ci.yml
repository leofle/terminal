name: CI

# Runs on every pull request so problems are caught before merging to main.
# (main now requires a PR, so this covers all changes; main's own pushes are
# handled by the deploy workflows.)
on:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate inline JavaScript & HTML
        run: node .github/scripts/check-syntax.mjs
